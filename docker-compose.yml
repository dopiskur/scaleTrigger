services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scaletrigger
      POSTGRES_PASSWORD: scaletrigger
      POSTGRES_DB: scaletrigger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaletrigger -d scaletrigger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  scaletrigger:
    build: .
    container_name: scaletrigger
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: PostgreSql
      # Fine for this local/dev stack; replace before using beyond a laptop.
      ConnectionStrings__PostgreSql: "Server=postgres;Port=5432;Database=scaletrigger;User Id=scaletrigger;Password=scaletrigger;SSL Mode=Disable;"
      Startup__FailFastOnDbCheck: "true"
      Auth__Enabled: "false"
      Jwt__Key: "abcdefghijklmnopqrstuvwxyz012345"
      Jwt__Issuer: "ScaleTrigger"
      Jwt__Audience: "ScaleTrigger.Clients"
      Jwt__ExpirationMinutes: "60"
      AdminUser__Username: "admin"
      AdminUser__Password: "admin"
      Cache__SlidingExpirationMinutes: "5"
      Load__LoadEnabled__Min: "1"
      Load__LoadEnabled__Max: "1"
      Load__CacheEnabled__Min: "1"
      Load__CacheEnabled__Max: "1"
      # Mirrors appsettings.json.example - without these, every Load:* value falls back
      # to 0 (LoadConfigDefaults.ReadFrom's default for a missing key), so a vote would
      # simulate zero load and this quickstart would demonstrate nothing.
      Load__ConfigRefresh__Min: "1"
      Load__ConfigRefresh__Max: "1"
      Load__CpuIterationsPerVote__Min: "100000"
      Load__CpuIterationsPerVote__Max: "500000"
      Load__MemoryKilobytesPerVote__Min: "3072"
      Load__MemoryKilobytesPerVote__Max: "8192"
      Load__DiskWriteKilobytesPerVote__Min: "32"
      Load__DiskWriteKilobytesPerVote__Max: "96"
      Load__NetworkLatencyMillisecondsPerVote__Min: "10"
      Load__NetworkLatencyMillisecondsPerVote__Max: "30"

volumes:
  postgres-data:
