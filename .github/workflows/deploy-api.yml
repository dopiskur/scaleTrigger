name: Deploy API to Azure

on:
  push:
    branches:
      - master
    paths:
      - 'ScaleTrigger/**'
      - 'ScaleTrigger.Tests/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: YOUR-API-APP-SERVICE-NAME
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: ScaleTrigger/ScaleTrigger.csproj
  TEST_PROJECT_PATH: ScaleTrigger.Tests/ScaleTrigger.Tests.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ${{ env.PUBLISH_DIR }}
